<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inview · lines</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page" id="main"></main>
    <script type="module">
      import { inview } from '@ccadran/inview'
      import { log } from './shared.ts'

      // 40 paragraphes découpés en lignes, callback sans retour : le split est conservé.
      const words = 'le texte est découpé en lignes puis conservé tel quel pour vérifier le redécoupage paresseux au resize'.split(' ')
      const main = document.querySelector('#main')
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('p')
        p.dataset.inview = 'p'
        p.id = `p-${i}`
        p.className = 'block'
        p.textContent = Array.from({ length: 50 }, (_, j) => words[(i + j) % words.length]).join(' ')
        main.append(p)
      }

      window.off = inview.on('p', { split: { type: 'lines' } }, ({ el }) => {
        log(`trigger ${el.id}`)
        el.classList.add('is-in')
      })
      window.inview = inview
    </script>
  </body>
</html>
